[package]
name = "lxagents-agentic"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Instructions for fully autonomous agentic workflows, one purpose per tool, served read-only."
license = "MIT"
authors = ["LXAgents"]
repository = "https://github.com/LXAgents-Skills/agentic"
homepage = "https://github.com/LXAgents-Skills/agentic#readme"
keywords = ["mcp", "model-context-protocol", "agent-instructions", "lxagents"]
publish = false
build = "build.rs"
include = ["/src", "/build.rs", "/content", "/LICENSE", "/README.md"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "lxagents-agentic"
path = "src/main.rs"

[dependencies]
axum = "0.8"
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-std", "time"] }

[dev-dependencies]
regex = "1"
rmcp = { version = "3.10", default-features = false, features = ["client", "server", "transport-child-process"] }
tokio = { version = "1", features = ["process", "io-util"] }

[profile.release]
strip = true
lto = "thin"
